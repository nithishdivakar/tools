<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>So Ham</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --accent: #007aff;
      --accent-stop: #ff3b30;
      --subtext: #aaaaaa;
      --border: #333333;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin: 0 0 4px 0;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--subtext);
      font-weight: 600;
      margin-top: 4px;
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

/* 1 row, 4 columns */
.grid-1x4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

/* 4 rows, 1 column */
.grid-4x1 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

    .input-group {
      background-color: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--subtext);
      font-weight: 600;
    }

    select, input {
      background-color: #2a2a2a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .duration-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }

    .duration-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent);
      margin-top: 4px;
    }

    .status-display {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .phase-text {
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .sub-phase-text {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    button.play-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.play-btn:active {
      transform: scale(0.98);
    }

    button.play-btn.playing {
      background-color: var(--accent-stop);
    }

    .cache-version {
      margin-top: auto;
      padding-top: 20px;
      color: var(--subtext);
      font-size: 12px;
      font-family: monospace;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- HTML5 Audio Element for Native iOS Background Playback -->
  <audio id="audioPlayer" playsinline></audio>

  <div class="container">
    <h1>So Ham</h1>

    <!-- Phase Durations -->
    <div class="section-title">Phases</div>
    <div class="grid-1x4">
      <div class="input-group">
        <label for="inSec">In</label>
        <select id="inSec" class="calc-trigger"></select>
      </div>

      <div class="input-group">
        <label for="hold1Sec">Hold</label>
        <select id="hold1Sec" class="calc-trigger"></select>
      </div>

      <div class="input-group">
        <label for="outSec">Out</label>
        <select id="outSec" class="calc-trigger"></select>
      </div>

      <div class="input-group">
        <label for="hold2Sec">Hold</label>
        <select id="hold2Sec" class="calc-trigger"></select>
      </div>
    </div>


    <!-- Duration Display -->
    <div class="duration-card">
      <label>Total Duration</label>
      <div id="durationDisplay" class="duration-value">0s</div>
    </div>

    <!-- Active State Visualizer -->
    <div class="status-display">
      <div id="phaseText" class="phase-text">READY</div>
      <div id="subPhaseText" class="sub-phase-text">Press Play to begin</div>
    </div>

    <!-- Play/Stop Button -->
    <button id="playBtn" class="play-btn">Play</button>

    <!-- Tempo & Repetitions -->
    <div class="section-title">Session Pace & Sound Style</div>
      <div class="input-group">
        <label for="soundStyle">Sound Style</label>
        <select id="soundStyle">
          <option value="sustained" selected>Sustained Pad (Crossfade Bleed)</option>
          <option value="pulsed">Pulsed Beat / Ticks</option>
        </select>
      </div>

    
    <div class="grid-2x2">
      <div class="input-group">
        <label for="bpmSec">BPM</label>
        <select id="bpmSec" class="calc-trigger">
          <option value="40">40</option>
          <option value="60">60</option>
          <option value="80" selected>80</option>
          <option value="100">100</option>
          <option value="120">120</option>
          <option value="150">150</option>
          <option value="180">180</option>
        </select>
      </div>
      <div class="input-group">
        <label for="repsVal">Repetitions</label>
        <input type="number" id="repsVal" class="calc-trigger" value="5" min="1" max="999">
      </div>
    </div>

      <div class="input-group" style="grid-column: span 2;">
        <label for="repsVal">Repetitions</label>
        <input type="number" id="repsVal" class="calc-trigger" value="5" min="1" max="999">
      </div>



    <!-- Phase Chord Sounds -->
    <div class="section-title">Sound</div>
    <div class="grid-4x1">
      <div class="input-group">
        <label for="inChord">In</label>
        <select id="inChord" class="chord-select"></select>
      </div>

      <div class="input-group">
        <label for="hold1Chord">Hold</label>
        <select id="hold1Chord" class="chord-select"></select>
      </div>

      <div class="input-group">
        <label for="outChord">Out</label>
        <select id="outChord" class="chord-select"></select>
      </div>

      <div class="input-group">
        <label for="hold2Chord">Hold</label>
        <select id="hold2Chord" class="chord-select"></select>
      </div>
    </div>


    <!-- Cache Footer -->
    <div id="cacheVersion" class="cache-version">Checking cache...</div>
  </div>

  <script>
    // =========================================================
    // CHORD & SOUND PRESET LIBRARY
    // =========================================================
    const CHORDS = {
      // Single Tones (Original)
      single_high: { name: "A4 - High", freqs: [440.00] },
      single_mid:  { name: "E4 - Mid", freqs: [329.63] },
      single_low:  { name: "C4 - Low", freqs: [261.63] },

      // Triads & Chords
      c_major:     { name: "C Major Triad", freqs: [261.63, 329.63, 392.00] },
      a_minor:     { name: "A Minor Triad", freqs: [220.00, 261.63, 329.63] },
      c_maj7:      { name: "C Major 7th (Dreamy)", freqs: [261.63, 329.63, 392.00, 493.88] },
      a_sus2:      { name: "A Sus2 (Open & Soft)", freqs: [220.00, 293.66, 329.63] },
      perfect_5th: { name: "Root + 5th (Peaceful)", freqs: [261.63, 392.00] },
      octave_pad:  { name: "Octave Blend (Expansive)", freqs: [261.63, 523.25] }
    };

    const audioPlayer = document.getElementById('audioPlayer');
    let isPlaying = false;
    let queue = [];
    let secondsPerTick = 0.75;
    let totalRepsConfigured = 1;
    let currentObjectUrl = null;

    // =========================================================
    // WAV AUDIO BLOB GENERATOR
    // Converts rendered AudioBuffer into a WAV Blob for HTML5 <audio>
    // =========================================================
    function bufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sample, offset = 0, pos = 0;

      function writeString(str) {
        for (let i = 0; i < str.length; i++) {
          out.setUint8(pos++, str.charCodeAt(i));
        }
      }

      function setUint16(data) {
        out.setUint16(pos, data, true);
        pos += 2;
      }

      function setUint32(data) {
        out.setUint32(pos, data, true);
        pos += 4;
      }

      writeString('RIFF');
      setUint32(length - 8);
      writeString('WAVE');
      writeString('fmt ');
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      writeString('data');
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: 'audio/wav' });
    }

    // =========================================================
    // UI INITIALIZATION & POPULATION
    // =========================================================
    function populateDropdowns() {
      // 1. Durations
      const dropdownIds = ['inSec', 'hold1Sec', 'outSec', 'hold2Sec'];
      dropdownIds.forEach(id => {
        const select = document.getElementById(id);
        for (let i = 0; i <= 16; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = i;
          select.appendChild(opt);
        }
        select.value = 4; // Default all to 2
      });

      // 2. Chords
      const chordDropdowns = [
        { id: 'inChord', defaultKey: 'c_maj7' },
        { id: 'hold1Chord', defaultKey: 'a_minor' },
        { id: 'outChord', defaultKey: 'c_major' },
        { id: 'hold2Chord', defaultKey: 'octave_pad' }
      ];

      chordDropdowns.forEach(item => {
        const select = document.getElementById(item.id);
        Object.keys(CHORDS).forEach(key => {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = CHORDS[key].name;
          select.appendChild(opt);
        });
        select.value = item.defaultKey;
      });
    }

    function updateDuration() {
      const inVal = parseInt(document.getElementById('inSec').value) || 0;
      const hold1Val = parseInt(document.getElementById('hold1Sec').value) || 0;
      const outVal = parseInt(document.getElementById('outSec').value) || 0;
      const hold2Val = parseInt(document.getElementById('hold2Sec').value) || 0;
      const bpmVal = parseInt(document.getElementById('bpmSec').value) || 80;
      const repsVal = parseInt(document.getElementById('repsVal').value) || 1;

      const ticksPerRep = inVal + hold1Val + outVal + hold2Val;
      const totalTicks = ticksPerRep * repsVal;
      const secPerTick = 60 / bpmVal;
      const totalSeconds = totalTicks * secPerTick;

      const roundedSecs = Math.round(totalSeconds * 10) / 10;
      document.getElementById('durationDisplay').textContent = `${roundedSecs}s`;
    }

    // =========================================================
    // SEQUENCER & PRE-RENDERED AUDIO PLAYBACK
    // =========================================================
    function stopPlayback() {
      isPlaying = false;
      audioPlayer.pause();
      audioPlayer.currentTime = 0;

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      const playBtn = document.getElementById('playBtn');
      playBtn.textContent = 'Play';
      playBtn.classList.remove('playing');

      document.getElementById('phaseText').textContent = 'FINISHED';
      document.getElementById('subPhaseText').textContent = 'Press Play to restart';
    }

    async function startPlayback() {
      const inVal = parseInt(document.getElementById('inSec').value) || 0;
      const hold1Val = parseInt(document.getElementById('hold1Sec').value) || 0;
      const outVal = parseInt(document.getElementById('outSec').value) || 0;
      const hold2Val = parseInt(document.getElementById('hold2Sec').value) || 0;
      const bpmVal = parseInt(document.getElementById('bpmSec').value) || 80;
      totalRepsConfigured = parseInt(document.getElementById('repsVal').value) || 1;
      secondsPerTick = 60 / bpmVal;

      // Get selected chords for each phase
      const inChordKey = document.getElementById('inChord').value;
      const hold1ChordKey = document.getElementById('hold1Chord').value;
      const outChordKey = document.getElementById('outChord').value;
      const hold2ChordKey = document.getElementById('hold2Chord').value;

      const inFreqs = CHORDS[inChordKey] ? CHORDS[inChordKey].freqs : [440.00];
      const hold1Freqs = CHORDS[hold1ChordKey] ? CHORDS[hold1ChordKey].freqs : [261.63];
      const outFreqs = CHORDS[outChordKey] ? CHORDS[outChordKey].freqs : [329.63];
      const hold2Freqs = CHORDS[hold2ChordKey] ? CHORDS[hold2ChordKey].freqs : [261.63];

      // Build execution queue
      queue = [];
      for (let r = 1; r <= totalRepsConfigured; r++) {
        for (let i = 1; i <= inVal; i++) {
          queue.push({ phase: 'IN', step: i, total: inVal, freqs: inFreqs, rep: r });
        }
        for (let i = 1; i <= hold1Val; i++) {
          queue.push({ phase: 'HOLD', step: i, total: hold1Val, freqs: hold1Freqs, rep: r });
        }
        for (let i = 1; i <= outVal; i++) {
          queue.push({ phase: 'OUT', step: i, total: outVal, freqs: outFreqs, rep: r });
        }
        for (let i = 1; i <= hold2Val; i++) {
          queue.push({ phase: 'HOLD', step: i, total: hold2Val, freqs: hold2Freqs, rep: r });
        }
      }

      if (queue.length === 0) {
        document.getElementById('phaseText').textContent = 'NO INPUT';
        document.getElementById('subPhaseText').textContent = 'Set at least one phase > 0';
        return;
      }

      // Indicate loading/rendering
      const playBtn = document.getElementById('playBtn');
      playBtn.textContent = 'Preparing...';
      document.getElementById('phaseText').textContent = 'GENERATING';
      document.getElementById('subPhaseText').textContent = 'Building...';

      const soundStyle = document.getElementById('soundStyle').value;

      // Render multi-oscillator audio track in background OfflineAudioContext
      const sampleRate = 44100;
      const totalDuration = queue.length * secondsPerTick;
      // Add a 0.6s padding to allow the final chord fade-out tail to complete gracefully
      const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, Math.ceil(sampleRate * (totalDuration + 0.6)), sampleRate);

      if (soundStyle === 'sustained') {
        // Continuous sustained chords with crossfade bleed between phase transitions
        let currentPhaseStartTime = 0;
        const crossfadeTime = 0.5; // Seconds of overlap between phase chord changes

        for (let r = 1; r <= totalRepsConfigured; r++) {
          const phases = [
            { sec: inVal, freqs: inFreqs },
            { sec: hold1Val, freqs: hold1Freqs },
            { sec: outVal, freqs: outFreqs },
            { sec: hold2Val, freqs: hold2Freqs }
          ];

          phases.forEach(p => {
            if (p.sec > 0) {
              const phaseDuration = p.sec * secondsPerTick;
              const phaseEndTime = currentPhaseStartTime + phaseDuration;
              const freqs = p.freqs;
              const noteVolume = 0.25 / freqs.length;

              // Ensure crossfade duration doesn't exceed half the phase duration
              const fadeDuration = Math.min(crossfadeTime, phaseDuration * 0.5);

              freqs.forEach(freq => {
                const osc = offlineCtx.createOscillator();
                const gainNode = offlineCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, currentPhaseStartTime);

                // Fade in at phase start
                gainNode.gain.setValueAtTime(0.0001, currentPhaseStartTime);
                gainNode.gain.linearRampToValueAtTime(noteVolume, currentPhaseStartTime + fadeDuration);

                // Hold sustained volume through the phase
                gainNode.gain.setValueAtTime(noteVolume, phaseEndTime);

                // Crossfade bleed: Fade out past the phase boundary into the next phase's start window
                gainNode.gain.linearRampToValueAtTime(0.0001, phaseEndTime + fadeDuration);

                osc.connect(gainNode);
                gainNode.connect(offlineCtx.destination);

                osc.start(currentPhaseStartTime);
                osc.stop(phaseEndTime + fadeDuration);
              });

              currentPhaseStartTime = phaseEndTime;
            }
          });
        }
      } else {
        // Pulsed Ticks (short 0.08s ticks on every beat)
        queue.forEach((item, index) => {
          const startTime = index * secondsPerTick;
          const freqs = item.freqs;

          const noteVolume = 0.3 / freqs.length;

          freqs.forEach(freq => {
            const osc = offlineCtx.createOscillator();
            const gainNode = offlineCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);

            gainNode.gain.setValueAtTime(0, startTime);
            gainNode.gain.linearRampToValueAtTime(noteVolume, startTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08);

            osc.connect(gainNode);
            gainNode.connect(offlineCtx.destination);

            osc.start(startTime);
            osc.stop(startTime + 0.08);
          });
        });
      }

      const renderedBuffer = await offlineCtx.startRendering();
      const wavBlob = bufferToWav(renderedBuffer);

      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(wavBlob);

      audioPlayer.src = currentObjectUrl;

      // Lock screen Media Metadata
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Breath Ticker',
          artist: 'Breathing Exercise',
          album: 'PWA Session'
        });
        navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
        navigator.mediaSession.setActionHandler('pause', () => stopPlayback());
      }

      isPlaying = true;
      playBtn.textContent = 'Stop';
      playBtn.classList.add('playing');

      audioPlayer.play().catch(err => {
        console.error('Audio playback error:', err);
        stopPlayback();
      });
    }

    // Sync UI display with the playback position of HTML5 audio
    audioPlayer.addEventListener('timeupdate', () => {
      if (!isPlaying || queue.length === 0) return;

      const currentTickIndex = Math.min(Math.floor(audioPlayer.currentTime / secondsPerTick), queue.length - 1);
      const current = queue[currentTickIndex];

      if (current) {
        document.getElementById('phaseText').textContent = current.phase;
        document.getElementById('subPhaseText').textContent = `Tick ${current.step} / ${current.total} — Rep ${current.rep} of ${totalRepsConfigured}`;
      }
    });

    audioPlayer.addEventListener('ended', () => {
      stopPlayback();
    });

    // =========================================================
    // EVENT LISTENERS
    // =========================================================
    populateDropdowns();

    document.querySelectorAll('.calc-trigger').forEach(elem => {
      elem.addEventListener('change', updateDuration);
      elem.addEventListener('input', updateDuration);
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
        document.getElementById('phaseText').textContent = 'READY';
        document.getElementById('subPhaseText').textContent = 'Press Play to begin';
      } else {
        startPlayback();
      }
    });

    updateDuration();

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    // Cache Version Display
    async function displayCacheName() {
      const versionElem = document.getElementById('cacheVersion');
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          versionElem.textContent = keys.length > 0 ? keys.join(', ') : 'No active cache';
        } catch (err) {
          versionElem.textContent = 'Unable to fetch cache key';
        }
      } else {
        versionElem.textContent = 'Cache API not supported';
      }
    }

    displayCacheName();
  </script>
</body>
</html>
