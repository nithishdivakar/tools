<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta name="theme-color" content="#FAF9F6">
<title>thing counter</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>


/*
| Role        | Job                                       | Example              |
|------------ |------------------------------------------ |---------------------- |
| background  | page canvas                               | #FAF9F6             |
| surface     | cards, inputs, raised elements            | #FFFFFF             |
| ink         | primary text                              | #1B1D18             |
| ink-mute    | secondary/meta text                       | #6B6F63             |
| line        | borders, dividers                         | #E4E1D6             |
| accent      | primary actions, emphasis, brand feeling  | #1F6F54             |
| danger      | destructive actions only                  | #B23A2E             |
*/

:root {
  /* ============================================
     SEED — change only these 3 values to re-theme
     everything below derives from this
     ============================================ */
  --seed-hue: 122;      /* 0–360, the accent's position on the color wheel */
  --seed-sat: 39%;      /* accent saturation */
  --seed-light: 49%;    /* accent lightness */

  /* danger is fixed to the red family by convention,
     not derived from the seed — change this on purpose, not by accident */
  --danger-hue: 6;

  /* ============================================
     ACCENT — the seed itself, plus its states
     ============================================ */
  --accent:      hsl(var(--seed-hue), var(--seed-sat), var(--seed-light));
  --accent-dark: hsl(var(--seed-hue), var(--seed-sat), calc(var(--seed-light) - 10%));
  --accent-wash: hsla(var(--seed-hue), var(--seed-sat), var(--seed-light), 0.09);

  /* ============================================
     DANGER — separate hue, same S/L pattern as accent
     so it carries equal visual "weight"
     ============================================ */
  --danger:      hsl(var(--danger-hue), 45%, 45%);
  --danger-wash: hsla(var(--danger-hue), 45%, 45%, 0.08);

  /* ============================================
     NEUTRALS — tinted with the seed's hue at low
     saturation, so they feel like "the same world"
     as the accent instead of generic gray
     ============================================ */
  --background: hsl(var(--seed-hue), 12%, 97%);   /* near-white, faint tint */
  --surface:    hsl(var(--seed-hue), 20%, 100%);  /* pure white — raised elements pop off background */
  --ink:        hsl(var(--seed-hue), 10%, 11%);   /* near-black, faint tint */
  --ink-mute:   hsl(var(--seed-hue), 6%, 43%);    /* secondary text */
  --line:       hsl(var(--seed-hue), 15%, 89%);   /* borders/dividers */
}


  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--background); }
  body {
    margin: 0;
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  .logo{
    background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%22 y=%2265%22 font-family=%22monospace%22 font-size=%2248%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22black%22>%23</text></svg>');
    width: 30px;
    height: 30px;
    background-size: contain;
    background-repeat: no-repeat;
  }
  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px calc(104px + env(safe-area-inset-bottom));
  }
  .topbar {
      display: flex;
      align-items: center;
      flex-direction: row;
      gap: 0px;
  }

  .topbar h1 {
    font-family: 'Fraunces', ui-serif, Georgia, serif;
    font-weight: 600;
    font-size: 30px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .tagline {
    color: var(--ink-mute);
    font-size: 12.5px;
    margin: 4px 0 0;
  }

  .field-label {
    display: block;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.03em;
    margin-bottom: 7px;
  }

  .field-group { margin-top: 30px; }
  .thing-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .thing-row .field-label {
    margin-bottom: 0;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .thing-row .thing-field { flex: 1 1 auto; }
  .custom-input-row { margin-top: 14px; }
  .thing-field {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--line);
    background: transparent;
    font-family: 'Fraunces', ui-serif, Georgia, serif;
    font-size: 25px;
    font-weight: 500;
    color: var(--ink);
    padding: 4px 2px 11px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .thing-field:focus { border-bottom-color: var(--accent); }
  .thing-field::placeholder { color: var(--ink-faint); }

  .chips {
    display: flex;
    gap: 8px;
    margin-top: 13px;
    flex-wrap: wrap;
  }
  .chip {
    font-family: inherit;
    font-size: 10px;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chip:active { transform: scale(0.96); }
  .chip.active {
    border-color: var(--accent);
    color: var(--accent-dark);
    background: var(--accent-wash);
  }
  .chip.empty {
    color: var(--ink-faint);
    border-style: dashed;
  }
  .chip.chip-custom {
    border-style: dashed;
    color: var(--ink-mute);
  }
  .chip.chip-custom.active {
    border-style: solid;
  }

  .hero {
    margin-top: 34px;
  }
  #recordBtn {
    width: 100%;
    display: block;
    text-align: center;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 20px;
    border-radius: 18px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.04em;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.1s ease;
  }
  #recordBtn:active { background: var(--accent-dark); transform: scale(0.98); }
  #recordBtn.err { background: var(--danger); }

  .reps-group {
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-direction: column;
  }
  .reps-group .field-label { margin-bottom: 0; }
  .stepper {
    display: flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 11px;
    overflow: hidden;
    background: var(--paper-raised);
  }
  .stepper button {
    width: 46px;
    height: 46px;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 20px;
    color: var(--ink);
    cursor: pointer;
  }
  .stepper button:active { background: var(--line); }
  .stepper input {
    width: 54px;
    height: 46px;
    text-align: center;
    border: none;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    font-family: inherit;
    font-size: 16px;
    background: transparent;
    color: var(--ink);
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .day-section { margin-top: 34px; }
  .day-header-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.03em;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--line);
  }

  /* date column width sized to comfortably hold a count badge circle
     while staying narrow relative to a full text column */
  :root { --date-col-w: 30px; }

  .grid-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table.thing-grid {
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    width: max-content;
  }
  .thing-grid th,
  .thing-grid td {
    padding: 0;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    text-align: center;
    vertical-align: middle;
  }
  .thing-grid th:last-child,
  .thing-grid td:last-child { border-right: none; }

  .grid-corner {
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--background);
    border-bottom: 2px solid var(--line);
    width: 108px;
  }
  .grid-date-th {
    width: var(--date-col-w);
    height: 92px;
    border-bottom: 2px solid var(--line);
    vertical-align: bottom;
    padding-bottom: 8px;
  }
  .grid-date-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.02em;
    display: inline-block;
  }
  .grid-thing-cell {
    position: sticky;
    left: 0;
    z-index: 1;
    background: var(--background);
    font-family: 'Fraunces', ui-serif, Georgia, serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    text-align: left;
    padding: 0 10px;
    width: 108px;
    max-width: 108px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .grid-count-cell { width: var(--date-col-w); padding: 5px 0; }
  .count-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1;
  }

  .log-section { margin-top: 34px; }
  .log-header {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.03em;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--line);
  }
  .log-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 10px;
    padding: 0px 0;
    border-bottom: 1px solid var(--line);
  }
  .log-thing {
    font-family: 'Fraunces', ui-serif, Georgia, serif;
    font-size: 15px;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .log-time { font-size: 11px; color: var(--ink-mute); }
  .log-reps {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--accent-dark);
    background: var(--accent-wash);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .log-del {
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 15px;
    width: 30px;
    height: 30px;
    cursor: pointer;
  }
  .empty-note {
    padding: 20px 0;
    text-align: center;
    color: var(--ink-mute);
    font-size: 12px;
  }

  details.csv-details {
    margin-top: 26px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  summary {
    font-size: 11px;
    color: var(--ink-mute);
    cursor: pointer;
    list-style: none;
    letter-spacing: 0.02em;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸  "; }
  details[open] summary::before { content: "▾  "; }
  .csv-out {
    width: 100%;
    margin-top: 11px;
    min-height: 110px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    padding: 10px;
    resize: vertical;
  }
  .csv-hint {
    font-size: 10.5px;
    color: var(--ink-mute);
    margin: 8px 2px 0;
    line-height: 1.5;
  }
  .csv-actions { display: flex; gap: 8px; margin-top: 9px; }
  .csv-actions button {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    border-radius: 9px;
    padding: 10px;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    cursor: pointer;
  }
  .csv-actions button.danger { color: var(--danger); border-color: rgba(178, 58, 46, 0.35); background: var(--danger-wash); }

  .sw-note {
    margin-top: 24px;
    font-size: 10px;
    color: var(--ink-faint);
    text-align: center;
  }

  .status-toast {
    position: fixed;
    left: 50%;
    bottom: calc(88px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--background);
    font-family: inherit;
    font-size: 12px;
    padding: 9px 15px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 82%;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 20;
  }
  .status-toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .status-toast.err { background: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    #recordBtn, .chip, .status-toast { transition: none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="logo"></div>
    <h1>thing counter</h1>
  </div>

  <main>
    <section class="field-group">
      <span class="field-label">thing</span>
      <div class="chips" id="chipsRow"></div>
      <div class="thing-row custom-input-row" id="customInputRow" hidden>
        <input type="text" id="thingInput" class="thing-field" placeholder="type a new thing…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      </div>
    </section>

    <section class="reps-group">
      <div class="stepper">
        <button type="button" id="repsDown" aria-label="decrease reps">−</button>
        <input type="number" id="repsInput" value="1" min="1" step="1" inputmode="numeric">
        <button type="button" id="repsUp" aria-label="increase reps">+</button>
      </div>
      <span class="field-label">reps for this entry</span>
    </section>
    <section class="hero">
      <button id="recordBtn" type="button">count</button>
    </section>


    <section class="day-section">
      <div class="day-header-row">
        <span>by thing</span>
      </div>
      <div id="dayView"></div>
    </section>

    <section class="log-section">
      <div class="log-header">
        <span>recent</span>
        <span id="totalCount">0 records</span>
      </div>
      <div id="recentLog"></div>
    </section>

    <details class="csv-details" id="csvDetails">
      <summary>import / export csv</summary>
      <textarea id="csvOut" class="csv-out" spellcheck="false"></textarea>
      <p class="csv-hint">paste csv data above (time,thing,reps - any column order works if there's a header row) then tap import to load it. this replaces everything currently recorded.</p>
      <div class="csv-actions">
        <button id="importCsvBtn" type="button">import</button>
        <button id="copyCsvBtn" type="button">copy</button>
        <button id="clearAllBtn" type="button" class="danger">clear all</button>
      </div>
    </details>

    <p class="sw-note" id="cacheVersion">checking cache...</p>
  </main>

  <div id="status" class="status-toast" role="status" aria-live="polite"></div>
</div>

<script>
  const STORAGE_KEY = 'smart-counter-records-v1';
  const MAX_THING_ROWS = 8;
  const MAX_DATE_COLUMNS = 30; // most recent N days shown in the by-thing grid
  const MAX_THING_CHIPS = 12; // most-frequent things offered as chips

  const thingInput = document.getElementById('thingInput');
  const chipsRow = document.getElementById('chipsRow');
  const customInputRow = document.getElementById('customInputRow');
  const repsInput = document.getElementById('repsInput');
  const repsUp = document.getElementById('repsUp');
  const repsDown = document.getElementById('repsDown');
  const recordBtn = document.getElementById('recordBtn');
  const statusEl = document.getElementById('status');
  const recentLog = document.getElementById('recentLog');
  const dayView = document.getElementById('dayView');
  const totalCountEl = document.getElementById('totalCount');
  const csvOut = document.getElementById('csvOut');
  const importCsvBtn = document.getElementById('importCsvBtn');
  const copyCsvBtn = document.getElementById('copyCsvBtn');
  const clearAllBtn = document.getElementById('clearAllBtn');

  let records = loadRecords();
  let statusTimer = null;

  function loadRecords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveRecords() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch (e) {
      // storage may be unavailable, fail silently
    }
  }

  // records store `time` as a plain "YYYY-MM-DD HH:MM:SS" string already
  // rendered in the device's local time at the moment it was recorded.
  // there is no ISO/UTC value anywhere - what's stored is exactly what
  // gets shown, so there's no locale/timezone conversion happening on
  // display or on sort (the zero-padded string sorts chronologically
  // just fine with plain string comparison).

  function pad(n) { return String(n).padStart(2, '0'); }

  // formats a Date object into that local display string
  function formatDateTime(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  // the string stored on a record IS the display string - nothing to convert
  function formatTime(timeStr) {
    return timeStr;
  }

  // the date portion is just the first 10 characters of that same string
  function formatDay(timeStr) {
    return timeStr.slice(0, 10);
  }

  let customOpen = false;

  function getThingFrequency() {
    const counts = new Map();
    records.forEach(rec => {
      counts.set(rec.thing, (counts.get(rec.thing) || 0) + 1);
    });
    return counts;
  }

  function openCustomInput() {
    customOpen = true;
    thingInput.value = '';
    customInputRow.hidden = false;
    renderChips();
    thingInput.focus();
  }

  function closeCustomInput() {
    customOpen = false;
    customInputRow.hidden = true;
    renderChips();
  }

  function renderChips() {
    // most-used things first, capped at MAX_THING_CHIPS
    const counts = getThingFrequency();
    const byFrequency = Array.from(counts.entries())
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .map(([thing]) => thing)
      .slice(0, MAX_THING_CHIPS);

    // while the custom field is open, typed text filters this same list
    const query = customOpen ? thingInput.value.trim().toLowerCase() : '';
    const visible = query
      ? byFrequency.filter(t => t.toLowerCase().includes(query))
      : byFrequency;

    chipsRow.innerHTML = '';

    if (visible.length === 0 && !query) {
      const span = document.createElement('span');
      span.className = 'chip empty';
      span.textContent = 'no things yet';
      chipsRow.appendChild(span);
    } else {
      const current = thingInput.value.trim();
      visible.forEach(thing => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip';
        btn.textContent = thing;
        if (thing === current) btn.classList.add('active');
        btn.addEventListener('click', () => {
          thingInput.value = thing;
          closeCustomInput();
        });
        chipsRow.appendChild(btn);
      });
    }

    // trailing chip: toggles the free-typing input open/closed
    const customBtn = document.createElement('button');
    customBtn.type = 'button';
    customBtn.className = 'chip chip-custom';
    customBtn.textContent = customOpen ? 'typing…' : '+ custom';
    if (customOpen) customBtn.classList.add('active');
    customBtn.addEventListener('click', () => {
      if (customOpen) closeCustomInput();
      else openCustomInput();
    });
    chipsRow.appendChild(customBtn);
  }

  // returns { bg, fg } for a count badge - color intensity scales with
  // how big the count is relative to the largest count shown in the grid
  function countBadgeColor(count, maxCount) {
    const t = maxCount > 0 ? count / maxCount : 0; // 0..1
    const lightness = 92 - t * 52; // low counts: pale wash, high counts: deep accent
    const bg = `hsl(var(--seed-hue), var(--seed-sat), ${lightness}%)`;
    const fg = t > 0.5 ? '#fff' : 'var(--ink)';
    return { bg, fg };
  }

  function renderDayView() {
    dayView.innerHTML = '';
    if (records.length === 0) {
      const p = document.createElement('div');
      p.className = 'empty-note';
      p.textContent = 'nothing recorded yet';
      dayView.appendChild(p);
      return;
    }

    // sum reps per thing per day, and an overall total per thing
    const byThingByDay = new Map();
    const thingTotals = new Map();
    const dayKeys = new Set();

    records.forEach(rec => {
      const day = formatDay(rec.time);
      dayKeys.add(day);

      if (!byThingByDay.has(rec.thing)) byThingByDay.set(rec.thing, new Map());
      const byDay = byThingByDay.get(rec.thing);
      byDay.set(day, (byDay.get(day) || 0) + rec.reps);

      thingTotals.set(rec.thing, (thingTotals.get(rec.thing) || 0) + rec.reps);
    });

    // rows: things in order of highest total reps, capped at MAX_THING_ROWS
    const things = Array.from(thingTotals.entries())
      .sort((a, b) => b[1] - a[1])
      .slice(0, MAX_THING_ROWS)
      .map(([thing]) => thing);

    // columns: dates newest to oldest, left to right, capped to the
    // most recent MAX_DATE_COLUMNS days
    const days = Array.from(dayKeys)
      .sort((a, b) => b.localeCompare(a))
      .slice(0, MAX_DATE_COLUMNS);

    // color intensity is scaled against the single largest cell value
    // shown anywhere in the grid, so darker badges really mean "the most"
    let maxCount = 0;
    things.forEach(thing => {
      const byDay = byThingByDay.get(thing);
      days.forEach(day => {
        const v = byDay.get(day) || 0;
        if (v > maxCount) maxCount = v;
      });
    });

    const wrap = document.createElement('div');
    wrap.className = 'grid-wrap';

    const table = document.createElement('table');
    table.className = 'thing-grid';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const corner = document.createElement('th');
    corner.className = 'grid-corner';
    headRow.appendChild(corner);
    days.forEach(day => {
      const th = document.createElement('th');
      th.className = 'grid-date-th';
      th.innerHTML = `<span class="grid-date-label">${escapeHtml(day)}</span>`;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    things.forEach(thing => {
      const byDay = byThingByDay.get(thing);
      const tr = document.createElement('tr');

      const nameCell = document.createElement('td');
      nameCell.className = 'grid-thing-cell';
      nameCell.textContent = thing;
      nameCell.title = thing;
      tr.appendChild(nameCell);

      days.forEach(day => {
        const count = byDay.get(day);
        const td = document.createElement('td');
        td.className = 'grid-count-cell';
        if (count) {
          const { bg, fg } = countBadgeColor(count, maxCount);
          td.innerHTML = `<span class="count-badge" style="background:${bg};color:${fg}">${count}</span>`;
        }
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    wrap.appendChild(table);
    dayView.appendChild(wrap);
  }

  function renderRecentLog() {
    const totalReps = records.reduce((sum, r) => sum + r.reps, 0);
    totalCountEl.textContent = `${records.length} record${records.length === 1 ? '' : 's'}, ${totalReps} rep${totalReps === 1 ? '' : 's'}`;
    recentLog.innerHTML = '';
    if (records.length === 0) {
      const p = document.createElement('div');
      p.className = 'empty-note';
      p.textContent = 'nothing recorded yet';
      recentLog.appendChild(p);
      return;
    }
    const last = records.slice(-8).reverse();
    last.forEach(rec => {
      const originalIndex = records.indexOf(rec);
      const row = document.createElement('div');
      row.className = 'log-row';
      row.innerHTML = `
        <div class="log-thing">${escapeHtml(rec.thing)}</div>
        <div class="log-time">${formatTime(rec.time)}</div>
        <div class="log-reps">×${rec.reps}</div>
      `;
      const delBtn = document.createElement('button');
      delBtn.className = 'log-del';
      delBtn.setAttribute('aria-label', 'delete record');
      delBtn.textContent = '×';
      delBtn.addEventListener('click', () => {
        records.splice(originalIndex, 1);
        afterChange();
      });
      row.appendChild(delBtn);
      recentLog.appendChild(row);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function csvEscape(str) {
    if (/[",\n]/.test(str)) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  // parses raw csv text into an array of row arrays, handling quoted
  // fields (with embedded commas, quotes, and newlines) per csvEscape above
  function parseCsvText(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field);
        field = '';
      } else if (c === '\n') {
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
      } else if (c === '\r') {
        // skip, \n handles the line break
      } else {
        field += c;
      }
    }
    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter(r => !(r.length === 1 && r[0].trim() === ''));
  }

  function parseCsvIntoRecords(text) {
    const rows = parseCsvText(text);
    if (rows.length === 0) return { records: [], skipped: 0 };

    let start = 0;
    // default column order (used only if no header row is found) is
    // time, thing, reps - matching what this app now exports
    let timeIdx = 0, thingIdx = 1, repsIdx = 2;
    const firstRow = rows[0].map(c => c.trim().toLowerCase());
    if (firstRow.includes('thing') || firstRow.includes('time') || firstRow.includes('reps')) {
      // header present - go strictly by its column names, so csv pasted
      // in any column order works correctly
      thingIdx = firstRow.indexOf('thing');
      timeIdx = firstRow.indexOf('time');
      repsIdx = firstRow.indexOf('reps');
      if (thingIdx === -1) thingIdx = 1;
      if (timeIdx === -1) timeIdx = 0;
      if (repsIdx === -1) repsIdx = 2;
      start = 1;
    }

    const parsed = [];
    let skipped = 0;
    for (let i = start; i < rows.length; i++) {
      const cells = rows[i];
      const thing = (cells[thingIdx] || '').trim();
      const timeRaw = (cells[timeIdx] || '').trim();
      const repsRaw = (cells[repsIdx] || '').trim();

      if (!thing) { skipped++; continue; }

      // if it's already in our "YYYY-MM-DD HH:MM:SS" display format, keep
      // it exactly as-is - no parsing, no timezone conversion, no locale
      // logic at all. otherwise fall back to Date parsing (for pasting in
      // other formats/ISO strings) and re-render it as a local display
      // string the same way a fresh recording would be.
      let time;
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(timeRaw)) {
        time = timeRaw;
      } else {
        let d = timeRaw ? new Date(timeRaw) : new Date();
        if (isNaN(d.getTime())) d = new Date();
        time = formatDateTime(d);
      }

      let reps = parseInt(repsRaw, 10);
      if (isNaN(reps) || reps < 1) reps = 1;

      parsed.push({ thing, time, reps });
    }

    // the rest of the app assumes records are in ascending chronological
    // order (recent log and chips read from the end of the array). the
    // stored strings are fixed-width and zero-padded, so plain string
    // comparison sorts them chronologically with no date parsing needed.
    parsed.sort((a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : 0));

    return { records: parsed, skipped };
  }

  function renderCsv() {
    const lines = ['time,thing,reps'];
    records.forEach(rec => {
      lines.push(`${csvEscape(rec.time)},${csvEscape(rec.thing)},${rec.reps}`);
    });
    csvOut.value = lines.join('\n');
  }

  function afterChange() {
    saveRecords();
    renderChips();
    renderDayView();
    renderRecentLog();
    renderCsv();
  }

  function setStatus(text, isErr) {
    statusEl.textContent = text;
    statusEl.classList.toggle('err', !!isErr);
    statusEl.classList.add('show');
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(() => statusEl.classList.remove('show'), 2400);
  }

  function clampReps(v) {
    v = parseInt(v);
    if (isNaN(v) || v < 1) v = 1;
    return v;
  }

  repsUp.addEventListener('click', () => {
    repsInput.value = clampReps(repsInput.value) + 1;
  });
  repsDown.addEventListener('click', () => {
    repsInput.value = Math.max(1, clampReps(repsInput.value) - 1);
  });
  repsInput.addEventListener('change', () => {
    repsInput.value = clampReps(repsInput.value);
  });

  thingInput.addEventListener('input', () => {
    if (customOpen) renderChips();
  });

  function doRecord() {
    const thing = thingInput.value.trim();
    if (!thing) {
      recordBtn.classList.add('err');
      setStatus('type a thing first', true);
      if (!customOpen) openCustomInput();
      else thingInput.focus();
      setTimeout(() => recordBtn.classList.remove('err'), 400);
      return;
    }
    const reps = clampReps(repsInput.value);
    records.push({
      thing: thing,
      time: formatDateTime(new Date()),
      reps: reps
    });
    if (customOpen) closeCustomInput();
    afterChange();
    setStatus(`recorded "${thing}" ×${reps}`);
    repsInput.value = 1;
  }

  recordBtn.addEventListener('click', doRecord);

  importCsvBtn.addEventListener('click', () => {
    const text = csvOut.value;
    if (!text.trim()) {
      setStatus('paste some csv data first', true);
      return;
    }
    const { records: parsed, skipped } = parseCsvIntoRecords(text);
    if (parsed.length === 0) {
      setStatus('no valid rows found in that csv', true);
      return;
    }
    const skipNote = skipped > 0 ? `, skipped ${skipped}` : '';
    const proceed = confirm(
      `import ${parsed.length} record${parsed.length === 1 ? '' : 's'}${skipNote}? this replaces everything currently recorded.`
    );
    if (!proceed) return;

    records = parsed;
    afterChange();
    setStatus(`imported ${parsed.length} record${parsed.length === 1 ? '' : 's'}`);
  });

  copyCsvBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(csvOut.value);
      copyCsvBtn.textContent = 'copied';
      setTimeout(() => { copyCsvBtn.textContent = 'copy'; }, 1000);
    } catch (e) {
      csvOut.select();
      document.execCommand('copy');
    }
  });

  clearAllBtn.addEventListener('click', () => {
    if (records.length === 0) return;
    if (confirm('clear all recorded data? this cannot be undone.')) {
      records = [];
      afterChange();
      setStatus('all records cleared');
    }
  });

  afterChange();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }

  async function displayCacheName() {
    const el = document.getElementById('cacheVersion');
    if ('caches' in window) {
      try {
        const keys = await caches.keys();
        el.textContent = 'sw cache: ' + (keys.length ? keys.join(', ') : 'none');
      } catch (e) {
        el.textContent = 'sw cache: unavailable';
      }
    } else {
      el.textContent = 'sw: not supported';
    }
  }
  displayCacheName();
</script>
</body>
</html>
