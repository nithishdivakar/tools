<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ticker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }
    button {
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 50%;
      width: 150px;
      height: 150px;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active {
      transform: scale(0.95);
      background-color: #005bb5;
    }
    .cache-version {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #777;
      font-size: 13px;
      font-family: monospace;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <button id="tickButton">Tick</button>
  
  <!-- Centered cache display element -->
  <div id="cacheVersion" class="cache-version">Checking cache...</div>

  <script>
    // AudioEngine abstracted exactly as in the provided source
    const AudioEngine = {
        ctx: null,
        resume() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
        },
        playTick() {
            if (!this.ctx) return; 
            
            // Synthesize a sharp, percussive "tick"
            const osc = this.ctx.createOscillator();
            const gainNode = this.ctx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(this.ctx.destination);
            
            osc.frequency.setValueAtTime(1500, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.05);
            
            gainNode.gain.setValueAtTime(1, this.ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
            
            osc.start(this.ctx.currentTime);
            osc.stop(this.ctx.currentTime + 0.05);
        }
    };

    document.getElementById('tickButton').addEventListener('click', () => {
        AudioEngine.resume(); 
        AudioEngine.playTick();
    });

    // Register Service Worker for offline PWA support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    // Query and display active CacheStorage names
    async function displayCacheName() {
      const versionElem = document.getElementById('cacheVersion');
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          if (keys.length > 0) {
            versionElem.textContent = keys.join(', ');
          } else {
            versionElem.textContent = 'No active cache';
          }
        } catch (err) {
          versionElem.textContent = 'Unable to fetch cache key';
        }
      } else {
        versionElem.textContent = 'Cache API not supported';
      }
    }

    displayCacheName();
  </script>
</body>
</html>
