<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Breath Ticker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --accent: #007aff;
      --accent-stop: #ff3b30;
      --subtext: #aaaaaa;
      --border: #333333;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin: 0 0 8px 0;
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-group {
      background-color: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--subtext);
      font-weight: 600;
    }

    select, input {
      background-color: #2a2a2a;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    .duration-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }

    .duration-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent);
      margin-top: 4px;
    }

    .status-display {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .phase-text {
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .sub-phase-text {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    button.play-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.play-btn:active {
      transform: scale(0.98);
    }

    button.play-btn.playing {
      background-color: var(--accent-stop);
    }

    .cache-version {
      margin-top: auto;
      padding-top: 20px;
      color: var(--subtext);
      font-size: 12px;
      font-family: monospace;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- HTML5 Audio Element for Native iOS Background Playback -->
  <audio id="audioPlayer" playsinline></audio>

  <div class="container">
    <h1>Breath Ticker</h1>

    <!-- 4 Breath Phase Dropdowns -->
    <div class="grid-2x2">
      <div class="input-group">
        <label for="inSec">In (Inhale)</label>
        <select id="inSec" class="calc-trigger"></select>
      </div>

      <div class="input-group">
        <label for="hold1Sec">Hold (After In)</label>
        <select id="hold1Sec" class="calc-trigger"></select>
      </div>

      <div class="input-group">
        <label for="outSec">Out (Exhale)</label>
        <select id="outSec" class="calc-trigger"></select>
      </div>

      <div class="input-group">
        <label for="hold2Sec">Hold (After Out)</label>
        <select id="hold2Sec" class="calc-trigger"></select>
      </div>
    </div>

    <!-- BPM & Repetitions -->
    <div class="grid-2x2">
      <div class="input-group">
        <label for="bpmSec">BPM</label>
        <select id="bpmSec" class="calc-trigger">
          <option value="40">40</option>
          <option value="80" selected>80</option>
          <option value="100">100</option>
          <option value="120">120</option>
          <option value="150">150</option>
          <option value="180">180</option>
        </select>
      </div>

      <div class="input-group">
        <label for="repsVal">Repetitions</label>
        <input type="number" id="repsVal" class="calc-trigger" value="5" min="1" max="999">
      </div>
    </div>

    <!-- Duration Display -->
    <div class="duration-card">
      <label>Total Duration</label>
      <div id="durationDisplay" class="duration-value">0s</div>
    </div>

    <!-- Active State Visualizer -->
    <div class="status-display">
      <div id="phaseText" class="phase-text">READY</div>
      <div id="subPhaseText" class="sub-phase-text">Press Play to begin</div>
    </div>

    <!-- Play/Stop Button -->
    <button id="playBtn" class="play-btn">Play</button>

    <!-- Cache Footer -->
    <div id="cacheVersion" class="cache-version">Checking cache...</div>
  </div>

  <script>
    // =========================================================
    // MUSICAL FREQUENCIES CONFIGURATION
    // =========================================================
    const FREQUENCIES = {
      in: 440.00,  // A4 — High / Inhale
      out: 329.63, // E4 — Medium / Exhale
      hold: 261.63 // C4 (Middle C) — Low / Hold
    };

    const audioPlayer = document.getElementById('audioPlayer');
    let isPlaying = false;
    let queue = [];
    let secondsPerTick = 0.75;
    let totalRepsConfigured = 1;
    let currentObjectUrl = null;

    // =========================================================
    // WAV AUDIO BLOB GENERATOR
    // Converts rendered AudioBuffer into a WAV Blob for HTML5 <audio>
    // =========================================================
    function bufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels;
      const length = buffer.length * numOfChan * 2 + 44;
      const out = new DataView(new ArrayBuffer(length));
      let channels = [], sample, offset = 0, pos = 0;

      function writeString(str) {
        for (let i = 0; i < str.length; i++) {
          out.setUint8(pos++, str.charCodeAt(i));
        }
      }

      function setUint16(data) {
        out.setUint16(pos, data, true);
        pos += 2;
      }

      function setUint32(data) {
        out.setUint32(pos, data, true);
        pos += 4;
      }

      writeString('RIFF');
      setUint32(length - 8);
      writeString('WAVE');
      writeString('fmt ');
      setUint32(16);
      setUint16(1);
      setUint16(numOfChan);
      setUint32(buffer.sampleRate);
      setUint32(buffer.sampleRate * 2 * numOfChan);
      setUint16(numOfChan * 2);
      setUint16(16);
      writeString('data');
      setUint32(length - pos - 4);

      for (let i = 0; i < buffer.numberOfChannels; i++) {
        channels.push(buffer.getChannelData(i));
      }

      while (offset < buffer.length) {
        for (let i = 0; i < numOfChan; i++) {
          sample = Math.max(-1, Math.min(1, channels[i][offset]));
          sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
          out.setInt16(pos, sample, true);
          pos += 2;
        }
        offset++;
      }

      return new Blob([out], { type: 'audio/wav' });
    }

    // =========================================================
    // UI INITIALIZATION & POPULATION
    // =========================================================
    function populateDropdowns() {
      const dropdownIds = ['inSec', 'hold1Sec', 'outSec', 'hold2Sec'];
      dropdownIds.forEach(id => {
        const select = document.getElementById(id);
        for (let i = 0; i <= 16; i++) {
          const opt = document.createElement('option');
          opt.value = i;
          opt.textContent = i;
          select.appendChild(opt);
        }
        select.value = 2; // Default all to 2
      });
    }

    function updateDuration() {
      const inVal = parseInt(document.getElementById('inSec').value) || 0;
      const hold1Val = parseInt(document.getElementById('hold1Sec').value) || 0;
      const outVal = parseInt(document.getElementById('outSec').value) || 0;
      const hold2Val = parseInt(document.getElementById('hold2Sec').value) || 0;
      const bpmVal = parseInt(document.getElementById('bpmSec').value) || 80;
      const repsVal = parseInt(document.getElementById('repsVal').value) || 1;

      const ticksPerRep = inVal + hold1Val + outVal + hold2Val;
      const totalTicks = ticksPerRep * repsVal;
      const secPerTick = 60 / bpmVal;
      const totalSeconds = totalTicks * secPerTick;

      const roundedSecs = Math.round(totalSeconds * 10) / 10;
      document.getElementById('durationDisplay').textContent = `${roundedSecs}s`;
    }

    // =========================================================
    // SEQUENCER & PRE-RENDERED AUDIO PLAYBACK
    // =========================================================
    function stopPlayback() {
      isPlaying = false;
      audioPlayer.pause();
      audioPlayer.currentTime = 0;

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      const playBtn = document.getElementById('playBtn');
      playBtn.textContent = 'Play';
      playBtn.classList.remove('playing');

      document.getElementById('phaseText').textContent = 'FINISHED';
      document.getElementById('subPhaseText').textContent = 'Press Play to restart';
    }

    async function startPlayback() {
      const inVal = parseInt(document.getElementById('inSec').value) || 0;
      const hold1Val = parseInt(document.getElementById('hold1Sec').value) || 0;
      const outVal = parseInt(document.getElementById('outSec').value) || 0;
      const hold2Val = parseInt(document.getElementById('hold2Sec').value) || 0;
      const bpmVal = parseInt(document.getElementById('bpmSec').value) || 80;
      totalRepsConfigured = parseInt(document.getElementById('repsVal').value) || 1;
      secondsPerTick = 60 / bpmVal;

      // Build execution queue
      queue = [];
      for (let r = 1; r <= totalRepsConfigured; r++) {
        for (let i = 1; i <= inVal; i++) {
          queue.push({ phase: 'IN (Inhale)', step: i, total: inVal, freq: FREQUENCIES.in, rep: r });
        }
        for (let i = 1; i <= hold1Val; i++) {
          queue.push({ phase: 'HOLD', step: i, total: hold1Val, freq: FREQUENCIES.hold, rep: r });
        }
        for (let i = 1; i <= outVal; i++) {
          queue.push({ phase: 'OUT (Exhale)', step: i, total: outVal, freq: FREQUENCIES.out, rep: r });
        }
        for (let i = 1; i <= hold2Val; i++) {
          queue.push({ phase: 'HOLD', step: i, total: hold2Val, freq: FREQUENCIES.hold, rep: r });
        }
      }

      if (queue.length === 0) {
        document.getElementById('phaseText').textContent = 'NO INPUT';
        document.getElementById('subPhaseText').textContent = 'Set at least one phase > 0';
        return;
      }

      // Indicate loading/rendering
      const playBtn = document.getElementById('playBtn');
      playBtn.textContent = 'Preparing...';
      document.getElementById('phaseText').textContent = 'GENERATING';
      document.getElementById('subPhaseText').textContent = 'Creating audio session...';

      // Render audio track in background buffer
      const sampleRate = 44100;
      const totalDuration = queue.length * secondsPerTick;
      const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, Math.ceil(sampleRate * totalDuration), sampleRate);

      queue.forEach((item, index) => {
        const startTime = index * secondsPerTick;
        const osc = offlineCtx.createOscillator();
        const gainNode = offlineCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(item.freq, startTime);

        gainNode.gain.setValueAtTime(0, startTime);
        gainNode.gain.linearRampToValueAtTime(0.3, startTime + 0.01);
        gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08);

        osc.connect(gainNode);
        gainNode.connect(offlineCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.08);
      });

      const renderedBuffer = await offlineCtx.startRendering();
      const wavBlob = bufferToWav(renderedBuffer);

      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(wavBlob);

      audioPlayer.src = currentObjectUrl;

      // Lock screen Media Metadata
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: 'Breath Ticker',
          artist: 'Breathing Exercise',
          album: 'PWA Session'
        });
        navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
        navigator.mediaSession.setActionHandler('pause', () => stopPlayback());
      }

      isPlaying = true;
      playBtn.textContent = 'Stop';
      playBtn.classList.add('playing');

      audioPlayer.play().catch(err => {
        console.error('Audio playback error:', err);
        stopPlayback();
      });
    }

    // Sync UI display with the playback position of HTML5 audio
    audioPlayer.addEventListener('timeupdate', () => {
      if (!isPlaying || queue.length === 0) return;

      const currentTickIndex = Math.min(Math.floor(audioPlayer.currentTime / secondsPerTick), queue.length - 1);
      const current = queue[currentTickIndex];

      if (current) {
        document.getElementById('phaseText').textContent = current.phase;
        document.getElementById('subPhaseText').textContent = `Tick ${current.step} / ${current.total} — Rep ${current.rep} of ${totalRepsConfigured}`;
      }
    });

    audioPlayer.addEventListener('ended', () => {
      stopPlayback();
    });

    // =========================================================
    // EVENT LISTENERS
    // =========================================================
    populateDropdowns();

    document.querySelectorAll('.calc-trigger').forEach(elem => {
      elem.addEventListener('change', updateDuration);
      elem.addEventListener('input', updateDuration);
    });

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) {
        stopPlayback();
        document.getElementById('phaseText').textContent = 'READY';
        document.getElementById('subPhaseText').textContent = 'Press Play to begin';
      } else {
        startPlayback();
      }
    });

    updateDuration();

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    // Cache Version Display
    async function displayCacheName() {
      const versionElem = document.getElementById('cacheVersion');
      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          versionElem.textContent = keys.length > 0 ? keys.join(', ') : 'No active cache';
        } catch (err) {
          versionElem.textContent = 'Unable to fetch cache key';
        }
      } else {
        versionElem.textContent = 'Cache API not supported';
      }
    }

    displayCacheName();
  </script>
</body>
</html>
