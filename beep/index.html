<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>interval-timer</title>
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --mute: #6b6b6b;
    --line: #cccccc;
    --accent: #111111;
    --err: #b00020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.4;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 {
    font-size: 13px;
    font-weight: 700;
    margin: 0 0 2px 0;
    text-transform: lowercase;
  }
  .meta {
    color: var(--mute);
    font-size: 11px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
  }
  .block {
    border: 1px solid var(--line);
    padding: 10px;
    margin-bottom: 10px;
  }
  .block-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--mute);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .block-label .repeat-inline {
    display: flex;
    align-items: center;
    gap: 4px;
    text-transform: none;
  }
  .block-label .repeat-inline span {
    color: var(--mute);
    font-size: 11px;
  }
  .block-label .repeat-inline input {
    width: 40px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    padding: 3px 4px;
    font-family: inherit;
    font-size: 12px;
    text-align: center;
  }
  .seg-row {
    display: grid;
    grid-template-columns: 22px 1fr 1fr 44px 20px;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }
  .seg-idx { color: var(--mute); text-align: right; }
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    padding: 5px 6px;
    font-family: inherit;
    font-size: 13px;
  }
  select {
    width: 100%;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    padding: 5px 4px;
    font-family: inherit;
    font-size: 12px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }
  .rm-btn {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--err);
    font-size: 12px;
    line-height: 1;
    padding: 5px 0;
    width: 100%;
  }
  .add-btn {
    background: var(--bg);
    border: 1px dashed var(--line);
    color: var(--fg);
    font-size: 12px;
    padding: 6px;
    width: 100%;
    margin-top: 2px;
  }
  .row-inline {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .row-inline label {
    color: var(--mute);
    font-size: 11px;
    white-space: nowrap;
  }
  .row-inline input[type="number"] { width: 70px; }
  .preview {
    font-size: 12px;
    background: #f5f5f5;
    border: 1px solid var(--line);
    padding: 8px;
    margin-top: 8px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .stat-line {
    display: flex;
    justify-content: space-between;
    color: var(--mute);
    font-size: 11px;
    margin-top: 4px;
  }
  .stat-line b { color: var(--fg); font-weight: 600; }
  #playBtn {
    width: 100%;
    background: var(--fg);
    color: var(--bg);
    border: none;
    padding: 12px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }
  #playBtn:active { opacity: 0.8; }
  #playBtn.playing { background: var(--err); }
  #playBtn.warn { background: var(--err); }
  #status {
    border: 1px solid var(--line);
    padding: 10px;
    margin-top: 10px;
    font-size: 12px;
  }
  #status .k { color: var(--mute); }
  .log {
    margin-top: 10px;
    font-size: 10px;
    color: var(--mute);
    border-top: 1px solid var(--line);
    padding-top: 8px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>$ beep beep</h1>

  <audio id="audioPlayer" playsinline></audio>

  <div class="block">
    <div class="block-label">
      <span>segments</span>
      <span class="repeat-inline">
        <span>× A</span>
        <input type="number" id="repeatCount" value="1" min="1" step="1">
      </span>
    </div>
    <div id="segList"></div>
    <button class="add-btn" id="addSegBtn">+ add segment</button>
  </div>

  <div class="block">
    <div class="block-label">tone</div>
    <div class="row-inline">
      <label>freq (hz)</label>
      <input type="number" id="beepFreq" value="880" min="100" max="4000" step="10">
      <label>len (ms)</label>
      <input type="number" id="beepLen" value="90" min="20" max="1000" step="10">
    </div>
  </div>

  <div id="previewBlock" class="preview">[ ] × 1</div>
  <div class="stat-line"><span>total duration</span><b id="durOut">0s</b></div>
  <div class="stat-line"><span>total beeps</span><b id="beepOut">0</b></div>
  <div class="stat-line"><span>est. render size</span><b id="sizeOut">0 MB</b></div>

  <button id="playBtn">play</button>

  <div id="status">
    <div class="k">state:</div>
    <div id="stateVal">idle</div>
  </div>

  <div class="log" id="cacheVersion">sw: checking cache…</div>
</div>

<script>
  const SAMPLE_RATE = 22050; // lower rate is fine for tones, halves render time/size vs 44.1k
  const audioPlayer = document.getElementById('audioPlayer');
  let currentObjectUrl = null;
  let isPlaying = false;
  let schedule = []; // flat list of {time, segIndex, beepIndex, rep}
  let totalDuration = 0;

  const segListEl = document.getElementById('segList');
  const addSegBtn = document.getElementById('addSegBtn');
  const repeatCountEl = document.getElementById('repeatCount');
  const beepFreqEl = document.getElementById('beepFreq');
  const beepLenEl = document.getElementById('beepLen');

  let segments = [
    { count: 4, interval: 2 },
    { count: 3, interval: 5 }
  ];

  function renderSegRows() {
    segListEl.innerHTML = '';
    segments.forEach((seg, i) => {
      const row = document.createElement('div');
      row.className = 'seg-row';
      row.innerHTML = `
        <div class="seg-idx">${i + 1}</div>
        <input type="number" min="1" step="1" value="${seg.count}" data-i="${i}" data-f="count" placeholder="a (beeps)">
        <input type="number" min="0.1" step="0.1" value="${seg.interval}" data-i="${i}" data-f="interval" placeholder="t (interval)">
        <select data-i="${i}" data-f="unit">
          <option value="sec" ${!seg.unit || seg.unit === 'sec' ? 'selected' : ''}>sec</option>
          <option value="min" ${seg.unit === 'min' ? 'selected' : ''}>min</option>
        </select>
        <button class="rm-btn" data-rm="${i}">x</button>
      `;
      segListEl.appendChild(row);
    });

    segListEl.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', e => {
        const i = parseInt(e.target.dataset.i);
        const f = e.target.dataset.f;
        segments[i][f] = parseFloat(e.target.value) || 0;
        recompute();
      });
    });
    segListEl.querySelectorAll('select').forEach(sel => {
      sel.addEventListener('change', e => {
        const i = parseInt(e.target.dataset.i);
        segments[i].unit = e.target.value;
        recompute();
      });
    });
    segListEl.querySelectorAll('[data-rm]').forEach(btn => {
      btn.addEventListener('click', e => {
        const i = parseInt(e.target.dataset.rm);
        segments.splice(i, 1);
        renderSegRows();
        recompute();
      });
    });
  }

  addSegBtn.addEventListener('click', () => {
    segments.push({ count: 1, interval: 1, unit: 'sec' });
    renderSegRows();
    recompute();
  });

  function segIntervalSeconds(seg) {
    const unit = seg.unit || 'sec';
    return unit === 'min' ? (seg.interval * 60) : seg.interval;
  }

  function recompute() {
    const A = parseInt(repeatCountEl.value) || 1;

    schedule = [];
    let t = 0;
    let totalBeeps = 0;

    for (let rep = 1; rep <= A; rep++) {
      segments.forEach((seg, si) => {
        const iv = segIntervalSeconds(seg);
        const count = Math.max(0, Math.floor(seg.count) || 0);
        for (let b = 1; b <= count; b++) {
          schedule.push({ time: t, seg: si, beep: b, rep });
          totalBeeps++;
          t += iv;
        }
      });
    }

    totalDuration = t;

    // preview string
    const segStr = segments.map(s => `${s.count}×${s.interval}${(s.unit || 'sec') === 'min' ? 'm' : 's'}`).join(' - ');
    document.getElementById('previewBlock').textContent = `[ ${segStr} ] × ${A}`;

    document.getElementById('durOut').textContent = formatDuration(totalDuration);
    document.getElementById('beepOut').textContent = totalBeeps;

    const estBytes = totalDuration * SAMPLE_RATE * 1; // 8-bit mono PCM
    document.getElementById('sizeOut').textContent = (estBytes / (1024 * 1024)).toFixed(1) + ' MB';

    const playBtn = document.getElementById('playBtn');
    if (totalDuration > 40 * 60) {
      playBtn.classList.add('warn');
    } else {
      playBtn.classList.remove('warn');
    }
  }

  function formatDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.round(sec % 60);
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  repeatCountEl.addEventListener('input', recompute);
  beepFreqEl.addEventListener('input', recompute);

  // =========================================================
  // WAV ENCODE
  // =========================================================
  // 8-bit PCM WAV: half the size/memory of 16-bit, inaudible loss for a simple tone.
  function bufferToWav(buffer) {
    const numChannels = 1;
    const sampleRate = buffer.sampleRate;
    const format = 1; // PCM
    const bitDepth = 8;
    const samples = buffer.getChannelData(0);

    const blockAlign = numChannels * bitDepth / 8; // 1 byte/sample
    const byteRate = sampleRate * blockAlign;
    const dataSize = samples.length * blockAlign;
    const bufferArr = new ArrayBuffer(44 + dataSize);
    const view = new DataView(bufferArr);

    function writeStr(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeStr(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeStr(8, 'WAVE');
    writeStr(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, format, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, byteRate, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitDepth, true);
    writeStr(36, 'data');
    view.setUint32(40, dataSize, true);

    // 8-bit WAV is unsigned PCM, centered at 128
    let offset = 44;
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      const val = Math.round((s * 0.5 + 0.5) * 255);
      view.setUint8(offset, val);
      offset += 1;
    }

    return new Blob([view], { type: 'audio/wav' });
  }

  // =========================================================
  // PLAYBACK
  // =========================================================
  function setState(text) {
    document.getElementById('stateVal').textContent = text;
  }

  function stopPlayback() {
    isPlaying = false;
    audioPlayer.pause();
    audioPlayer.currentTime = 0;
    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }
    const playBtn = document.getElementById('playBtn');
    playBtn.textContent = 'play';
    playBtn.classList.remove('playing');
    setState('idle');
  }

  async function startPlayback() {
    recompute();

    if (schedule.length === 0) {
      setState('error: no beeps configured');
      return;
    }

    const playBtn = document.getElementById('playBtn');
    playBtn.textContent = 'rendering…';
    setState(`rendering ${schedule.length} beeps / ${formatDuration(totalDuration)}…`);

    const freq = parseFloat(beepFreqEl.value) || 880;
    const lenSec = (parseFloat(beepLenEl.value) || 90) / 1000;

    const totalSamples = Math.ceil(SAMPLE_RATE * (totalDuration + 0.5));
    const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, totalSamples, SAMPLE_RATE);

    schedule.forEach(item => {
      const osc = offlineCtx.createOscillator();
      const gain = offlineCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, item.time);
      gain.gain.setValueAtTime(0, item.time);
      gain.gain.linearRampToValueAtTime(0.4, item.time + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.001, item.time + lenSec);
      osc.connect(gain);
      gain.connect(offlineCtx.destination);
      osc.start(item.time);
      osc.stop(item.time + lenSec + 0.02);
    });

    const renderedBuffer = await offlineCtx.startRendering();
    const wavBlob = bufferToWav(renderedBuffer);

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(wavBlob);
    audioPlayer.src = currentObjectUrl;

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'interval-timer',
        artist: 'beep sequence',
        album: `A×[${segments.map(s => s.count + 'x' + s.interval).join(',')}]`
      });
      navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
      navigator.mediaSession.setActionHandler('pause', () => stopPlayback());
    }

    isPlaying = true;
    playBtn.textContent = 'stop';
    playBtn.classList.add('playing');
    setState('playing');

    audioPlayer.play().catch(err => {
      setState('error: ' + err.message);
      stopPlayback();
    });
  }

  audioPlayer.addEventListener('timeupdate', () => {
    if (!isPlaying || schedule.length === 0) return;
    let idx = 0;
    for (let i = 0; i < schedule.length; i++) {
      if (schedule[i].time <= audioPlayer.currentTime) idx = i;
    }
    const cur = schedule[idx];
    setState(`rep ${cur.rep} — seg ${cur.seg + 1} — beep ${cur.beep} — t=${audioPlayer.currentTime.toFixed(1)}s`);
  });

  audioPlayer.addEventListener('ended', stopPlayback);

  document.getElementById('playBtn').addEventListener('click', () => {
    if (isPlaying) {
      stopPlayback();
    } else {
      startPlayback();
    }
  });

  renderSegRows();
  recompute();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }

  async function displayCacheName() {
    const el = document.getElementById('cacheVersion');
    if ('caches' in window) {
      try {
        const keys = await caches.keys();
        el.textContent = 'sw cache: ' + (keys.length ? keys.join(', ') : 'none');
      } catch (e) {
        el.textContent = 'sw cache: unavailable';
      }
    } else {
      el.textContent = 'sw: not supported';
    }
  }
  displayCacheName();
</script>
</body>
</html>
